name: Storefront browser acceptance

on:
  pull_request:
    paths:
      - 'storefront/**'
      - '.github/workflows/storefront-browser.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
  push:
    branches:
      - 'feat/storefront-knowledge-stories'
    paths:
      - 'storefront/**'
      - '.github/workflows/storefront-browser.yml'

permissions:
  contents: read

concurrency:
  group: storefront-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Story contracts and browser acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            storefront/package-lock.json
      - name: Install locked dependencies
        id: install
        run: |
          npm ci --ignore-scripts
          npm ci --prefix storefront --ignore-scripts
      - name: Build and run storefront contracts
        id: contracts
        run: npm --prefix storefront test
      - name: Validate Worker bundle without uploading
        if: steps.contracts.outcome == 'success'
        working-directory: storefront
        run: npx wrangler deploy --dry-run --config wrangler.jsonc
      - name: Install browser
        if: always() && steps.install.outcome == 'success'
        run: npx playwright install --with-deps chromium
      - name: Exercise desktop and mobile stories
        if: always() && steps.install.outcome == 'success'
        run: npx playwright test --config=storefront/playwright.config.mjs
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storefront-browser-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            storefront/browser-results/
            storefront/browser-report/
          if-no-files-found: warn
          retention-days: 7
