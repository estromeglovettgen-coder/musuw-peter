name: musuw-peter

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  app:
    image: ${PETER_APP_IMAGE:?set the verified release image}
    restart: unless-stopped
    env_file: /etc/musuw-peter/app.env
    environment:
      # TEI grants one permit per input; keep each request below its four-permit limit.
      BATCH_EMBED_SIZE: '1'
      NEO4J_ENABLE: 'true'
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
    secrets: [neo4j_auth]
    ports: ['127.0.0.1:18187:8080']
    entrypoint: ['/bin/bash', '/peter-entrypoint.sh']
    command: ['./WeKnora']
    volumes:
      - /var/lib/musuw-peter/files:/data/files
      - /var/lib/musuw-peter/skills:/app/skills/preloaded
      - /var/lib/musuw-peter/docreader:/tmp/docreader:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./app-entrypoint.sh:/peter-entrypoint.sh:ro
      - ./builtin_models.yaml:/app/config/builtin_models.yaml:ro
    mem_limit: 850m
    cpus: 2
    pids_limit: 256
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      neo4j: {condition: service_healthy}
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8080/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging: *logging

  postgres:
    image: ${PETER_POSTGRES_IMAGE:-paradedb/paradedb:v0.22.2-pg17}
    restart: unless-stopped
    environment:
      POSTGRES_DB: peter
      POSTGRES_USER: peter
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [/var/lib/musuw-peter/postgres:/var/lib/postgresql/data]
    command: ['postgres', '-c', 'shared_buffers=96MB', '-c', 'work_mem=4MB', '-c', 'max_connections=60']
    shm_size: 128m
    mem_limit: 600m
    cpus: 1.5
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U peter -d peter']
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  redis:
    image: ${PETER_REDIS_IMAGE:-redis:7.4-alpine}
    restart: unless-stopped
    volumes:
      - /var/lib/musuw-peter/redis:/data
      - /etc/musuw-peter/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: ['redis-server', '/usr/local/etc/redis/redis.conf']
    mem_limit: 160m
    cpus: 0.5
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping 2>&1 | grep -q "NOAUTH"']
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *logging

  neo4j:
    image: neo4j@sha256:155c8aad10d5c838bc3bbc476c0418779086547822acb214ec5e3d49ba336907
    restart: unless-stopped
    entrypoint: ['/bin/sh', '/peter-neo4j-entrypoint.sh']
    command: ['neo4j']
    secrets: [neo4j_auth]
    volumes:
      - /var/lib/musuw-peter/neo4j:/data
      - ./neo4j-entrypoint.sh:/peter-neo4j-entrypoint.sh:ro
    environment:
      NEO4JLABS_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: 'true'
      NEO4J_apoc_import_file_enabled: 'true'
      NEO4J_apoc_import_file_use__neo4j__config: 'true'
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 256m
      NEO4J_server_memory_pagecache_size: 128m
    mem_limit: 768m
    cpus: 0.75
    pids_limit: 256
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:7474/ >/dev/null']
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging: *logging

  embeddings:
    image: ${PETER_EMBEDDINGS_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9}
    restart: unless-stopped
    volumes: [/var/lib/musuw-peter/models:/data:ro]
    command: ['--model-id', '/data/bge-small-zh-v1.5', '--port', '80', '--max-concurrent-requests', '4', '--max-batch-tokens', '2048', '--max-client-batch-size', '8', '--auto-truncate']
    environment:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      HF_HUB_OFFLINE: '1'
    mem_limit: 650m
    cpus: 1.5
    logging: *logging

  reranker:
    image: ${PETER_EMBEDDINGS_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9}
    restart: unless-stopped
    volumes: [/var/lib/musuw-peter/models:/data:ro]
    command: ['--model-id', '/data/mmarco-reranker', '--port', '80', '--max-concurrent-requests', '2', '--max-batch-tokens', '512', '--max-client-batch-size', '20', '--auto-truncate']
    environment:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      HF_HUB_OFFLINE: '1'
    mem_limit: 800m
    cpus: 1.5
    logging: *logging

  docreader:
    image: ${PETER_DOCREADER_IMAGE:?set the verified parser image}
    restart: unless-stopped
    environment:
      GRPC_AUTH_TOKEN: ${DOCREADER_AUTH_TOKEN:?set a parser token}
      DOCREADER_GRPC_MAX_WORKERS: '2'
      DOCREADER_MARKITDOWN_MAX_WORKERS: '1'
      DOCREADER_PDF_RENDER_MAX_WORKERS: '1'
      DOCREADER_PDF_RENDER_PARALLELISM: '1'
    volumes: [/var/lib/musuw-peter/docreader:/tmp/docreader]
    mem_limit: 650m
    cpus: 1.5
    pids_limit: 192
    logging: *logging

  searxng-init:
    image: searxng/searxng@sha256:3284e8900e9b3e5df284ae8c48a26851ae2eff6f99b4b0b18ec3da5a4d9095c3
    entrypoint: ['/bin/sh', '-ec']
    command: ['cp /template/settings.yml /etc/searxng/settings.yml && chmod 0644 /etc/searxng/settings.yml']
    network_mode: none
    restart: 'no'
    volumes:
      - ./searxng-settings.yml:/template/settings.yml:ro
      - /var/lib/musuw-peter/searxng:/etc/searxng
    logging: *logging

  searxng:
    image: searxng/searxng@sha256:3284e8900e9b3e5df284ae8c48a26851ae2eff6f99b4b0b18ec3da5a4d9095c3
    restart: unless-stopped
    entrypoint: ['/bin/sh', '/peter-searxng-entrypoint.sh']
    secrets: [searxng_secret]
    volumes:
      - /var/lib/musuw-peter/searxng:/etc/searxng
      - ./searxng-entrypoint.sh:/peter-searxng-entrypoint.sh:ro
    depends_on:
      searxng-init: {condition: service_completed_successfully}
    mem_limit: 350m
    cpus: 0.5
    pids_limit: 128
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/config']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *logging

secrets:
  db_password:
    file: /etc/musuw-peter/db-password
  neo4j_auth:
    file: /etc/musuw-peter/neo4j-auth
  searxng_secret:
    file: /etc/musuw-peter/searxng-secret

networks:
  default:
    name: musuw-peter-services
