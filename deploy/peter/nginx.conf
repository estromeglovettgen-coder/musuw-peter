server {
    listen 80 default_server;
    server_name 62.234.188.55;
    location /.well-known/acme-challenge/ { root /var/lib/musuw-peter/acme; }
    location / { return 301 https://62.234.188.55$request_uri; }
}

server {
    listen 443 ssl http2 default_server;
    server_name 62.234.188.55;
    ssl_certificate /etc/letsencrypt/live/peter-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/peter-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PeterTLS:10m;
    root /opt/musuw-peter/current/frontend;
    index index.html;
    client_max_body_size 50m;
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    location = /operations.html { return 404; }
    location = /login { return 302 /auth/start$is_args$args; }
    location /auth/assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /auth/ {
        try_files $uri $uri/ /auth/index.html;
        add_header Cache-Control "no-cache";
    }
    location ~ /\. { deny all; }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
    location ~ ^/(api/|r/|health$) {
        proxy_pass http://127.0.0.1:18187;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
