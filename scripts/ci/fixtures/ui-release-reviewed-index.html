<!DOCTYPE html>
<html lang="en">
<head>
    <title>Musuw</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="renderer" content="webkit">
    <meta name="robots" content="noindex,nofollow">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="keywords" content="Musuw, personal knowledge workspace, grounded AI, evidence citations"/>
    <meta name="description" content="Musuw is a private knowledge workspace for source-grounded dialogue, connected Wiki pages, and exact evidence citations."/>
    <link rel="icon" type="image/png" href="/musuw-logo.png?v=20260822"/>
</head>
<body>
<script>
(function(){
  var userId='anon';
  try{
    var rawUser=localStorage.getItem('weknora_user');
    var parsedUser=rawUser?JSON.parse(rawUser):null;
    if(parsedUser&&parsedUser.id)userId=String(parsedUser.id);
  }catch(_){}
  var legacyThemeKey='WeKnora_theme';
  var userThemeKey=legacyThemeKey.replace('_theme','_'+userId+'_theme');
  var anonThemeKey=legacyThemeKey.replace('_theme','_anon_theme');
  var t=localStorage.getItem(userThemeKey)||localStorage.getItem(anonThemeKey)||localStorage.getItem(legacyThemeKey)||'light';
  if(t==='system')t=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
  document.documentElement.setAttribute('theme-mode',t);
  /* 与 theme.css 的 --musuw-canvas 完全一致，避免 CSS 接管时发生首屏跳色。 */
  var bg=t==='dark'?'#151619':'#fff';
  document.documentElement.style.background=bg;
  document.documentElement.style.minHeight='100%';
  document.documentElement.style.colorScheme=t==='dark'?'dark':'light';
  document.body.style.background=bg;
  document.body.style.minHeight='100%';
  try{
    var w=window.runtime;
    if(w){
      if(t==='dark'){
        if(w.WindowSetDarkTheme)w.WindowSetDarkTheme();
        if(w.WindowSetBackgroundColour)w.WindowSetBackgroundColour(21,22,25,255);
      }else{
        if(w.WindowSetLightTheme)w.WindowSetLightTheme();
        if(w.WindowSetBackgroundColour)w.WindowSetBackgroundColour(251,252,254,255);
      }
    }
  }catch(_){}
})();
</script>
<script>
(function(){
  try {
    if (localStorage.getItem('weknora_lite_mode') !== 'true') return;
    var saved = sessionStorage.getItem('weknora_lite_last_path');
    if (!saved || saved.indexOf('/platform/') !== 0 || saved.indexOf('/platform/organizations') === 0) return;
    var path = window.location.pathname;
    if (path !== '/' && path !== '/platform' && path !== '/platform/knowledge-bases') return;
    // Query parameters and OIDC fragments carry explicit entry intent. Never
    // replace either with stale navigation history.
    if (window.location.search || window.location.hash) return;
    var target = saved.indexOf('#') >= 0 ? saved.slice(0, saved.indexOf('#')) : saved;
    if (!target) return;
    var current = window.location.pathname + window.location.search;
    if (target !== current) window.history.replaceState(window.history.state, '', target);
  } catch (e) {}
})();
</script>
<script src="/config.js"></script>
<!--
  离线部署兼容：提前本地加载 tdesign-icons SVG sprite，避免 tdesign-vue-next 的
  <t-icon> 运行时向 https://tdesign.gtimg.com 发起请求（见 issue #867 / #897）。
  升级 tdesign-icons-vue-next 时需同步更新 public/tdesign-icons/<version>/fonts/index.js。
-->
<script src="/tdesign-icons/0.4.1/fonts/index.js"></script>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
