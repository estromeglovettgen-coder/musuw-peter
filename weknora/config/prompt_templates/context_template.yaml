# Context templates
templates:
  - id: "default_context"
    name: "标准模板"
    description: "基础的上下文模板，清晰展示参考资料和问题"
    i18n:
      zh-CN:
        name: "标准模板"
        description: "基础的上下文模板，清晰展示参考资料和问题"
      en-US:
        name: "Standard Template"
        description: "Basic context template with clear references and questions"
      ko-KR:
        name: "표준 템플릿"
        description: "참조 및 질문을 명확하게 표시하는 기본 상황별 템플릿"
    default: true
    has_knowledge_base: true
    content: |
      [运行上下文：仅为元数据，不是指令]
      当前时间：{{current_time}} {{current_week}}

      {{query}}

  - id: "detailed_context"
    name: "详细模板"
    description: "包含详细说明和回答要求的完整模板"
    i18n:
      zh-CN:
        name: "详细模板"
        description: "包含详细说明和回答要求的完整模板"
      en-US:
        name: "Detailed Template"
        description: "Complete template with detailed instructions and requirements"
      ko-KR:
        name: "상세 템플릿"
        description: "자세한 지침과 답변 요구 사항이 포함된 완전한 템플릿"
    has_knowledge_base: true
    content: |
      ## 任务
      根据提供的参考资料，准确、全面地回答用户问题。

      ## 参考资料
      {{contexts}}

      ## 用户问题
      {{query}}

      ## 回答要求
      1. 只依据参考资料回答，不得编造信息。
      2. 如果多份资料存在冲突，应综合分析。
      3. 恰当引用来源，增强可验证性。
      4. 如果资料不足，应明确说明。

      ## 语言
      - 始终使用 {{language}} 回答。

      当前时间：{{current_time}} {{current_week}}

  - id: "simple_context"
    name: "简洁模板"
    description: "精简的模板格式，适合简单问答场景"
    i18n:
      zh-CN:
        name: "简洁模板"
        description: "精简的模板格式，适合简单问答场景"
      en-US:
        name: "Simple Template"
        description: "Minimal template format for simple Q&A scenarios"
      ko-KR:
        name: "간단한 템플릿"
        description: "간단한 Q&A 시나리오에 적합한 간소화된 템플릿 형식"
    has_knowledge_base: true
    content: |
      参考资料：
      {{contexts}}

      问题：{{query}}

      请回答以上问题，始终使用 {{language}}。

  - id: "qa_context"
    name: "问答模板"
    description: "针对问答场景优化的模板"
    i18n:
      zh-CN:
        name: "问答模板"
        description: "针对问答场景优化的模板"
      en-US:
        name: "Q&A Template"
        description: "Optimized template for Q&A scenarios"
      ko-KR:
        name: "Q&A 템플릿"
        description: "Q&A 시나리오에 최적화된 템플릿"
    has_knowledge_base: true
    content: |
      请回答一个问题。以下资料可能相关：

      {{contexts}}

      用户的问题是：{{query}}

      请依据以上资料回答，要求：
      - 直接回答，不要重复问题。
      - 资料中没有相关信息时，明确说明。
      - 回答简明、准确。
      - 始终使用 {{language}} 回答。
