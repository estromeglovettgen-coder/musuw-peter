# Graph extraction prompt templates
# Used for knowledge graph entity and relationship extraction
templates:
  - id: "default_extract_entities"
    name: "实体提取"
    description: "从文本提取实体，用于构建知识图谱"
    default: true
    content: |
      ## 任务
      从用户提供的文本中提取符合以下类型的全部实体：
      EntityTypes: [Person, Organization, Location, Product, Event, Date, Work, Concept, Resource, Category, Operation]

      ## 要求
      1. 只输出 JSON 数组。
      2. 每个实体必须有 title、type；description 可选，但强烈建议提供。
      3. type 必须取自 EntityTypes，不创建新类型。
      4. 类型无法确定时，宁可跳过，不强行分类。
      5. 不输出解释或额外文字。
      6. 字段值不能包含 HTML 标签或其他代码。
      7. 实体有歧义时，在 description 明确所指对象。
      8. 没有实体时返回 []。

      ## 类型规则
      - Person：真实或虚构人物，包括历史人物、当代人物、文学角色。
      - Organization：公司、政府、团队、学校等组织。
      - Location：地理位置、地标、国家、城市。
      - Product：商品、服务、品牌等商业产品。
      - Event：事件、会议、节日、历史事件。
      - Date：日期、时间段、时代等时间信息。
      - Work：书籍、电影、音乐、艺术品等作品。
      - Concept：抽象概念、思想、理论。
      - Resource：自然资源、信息资源、工具。
      - Category：分类、类别、领域。
      - Operation：操作、行为、方法、流程。

      ## 提取步骤
      1. 仔细阅读并识别潜在实体。
      2. 为每个实体选择最合适的 EntityTypes 类型。
      3. 创建对象：title 为实体规范名称，不含引号等修饰；type 从 EntityTypes 选择；description 为根据文本生成的简短说明，使用来源语言。
      4. 检查各字段准确、格式正确。
      5. 合并为一个 JSON 数组。
      6. 确保最终 JSON 有效并满足要求。

      ## 语言
      - 实体标题必须与来源中的写法一致。
      - 描述使用 {{language}}。

      ## 示例
      [输入]
      文本：《罗密欧与朱丽叶》是威廉·莎士比亚在职业生涯早期创作的悲剧，讲述两个敌对家族的意大利青年之间的爱情。这是他在世时最受欢迎的戏剧之一，也是最常上演的作品之一。故事发生在意大利的维罗纳。两位主角罗密欧·蒙太古和朱丽叶·凯普莱特尽管家族敌对，仍深深相爱。

      [输出]
      [
        {"title":"罗密欧与朱丽叶","type":"Work","description":"莎士比亚创作的悲剧，讲述敌对家族两名青年之间的爱情"},
        {"title":"威廉·莎士比亚","type":"Person","description":"《罗密欧与朱丽叶》的作者，在职业生涯早期创作该剧"},
        {"title":"罗密欧·蒙太古","type":"Person","description":"该剧两位主角之一，来自蒙太古家族"},
        {"title":"朱丽叶·凯普莱特","type":"Person","description":"该剧两位主角之一，来自凯普莱特家族"},
        {"title":"维罗纳","type":"Location","description":"《罗密欧与朱丽叶》故事发生的意大利城市"},
        {"title":"蒙太古","type":"Organization","description":"剧中两个敌对家族之一，罗密欧所属的家族"},
        {"title":"凯普莱特","type":"Organization","description":"剧中两个敌对家族之一，朱丽叶所属的家族"}
      ]

  - id: "default_extract_relationships"
    name: "关系提取"
    description: "提取实体间的关系，用于构建知识图谱"
    default: true
    content: |
      ## 任务
      根据用户提供的实体数组和文本，提取实体之间明确存在的关系，形成结构化关系网络。

      ## 要求
      1. 只依据提供的文本，不编造关系。
      2. 输出 JSON 数组，每条关系是一个对象。
      3. 每个对象包含 source、target、description、strength。
      4. 只输出数组，不要解释或额外内容。
      5. 没有关系时返回 []。

      ## 关系规则
      - 仅提取文本明确表达的关系。
      - 起点和终点必须是实体数组中已有的实体。
      - description 简洁说明双方具体关系。
      - strength 标准：
        - 10：直接创作或从属，例如作者与作品、发明者与发明、母公司与子公司。
        - 9：同一实体的不同名称，例如别名、曾用名。
        - 8：密切关联、相互影响，例如密切伙伴、家人。
        - 7：明确但间接，例如作品中的角色、组织成员。
        - 6：有明确联系的间接关联，例如同事、相似产品。
        - 5：有关但联系较松，例如同领域不同概念。

      ## 提取步骤
      1. 仔细分析文本，找出明确关联的实体。
      2. 只考虑文本明确提到的关系，不编造。
      3. 为每个关系确定 source 和 target（必须是已有实体标题）、简洁准确的 description，以及依据上述标准的 strength（5–10 整数）。
      4. 判断方向：双向关系，例如“A 是 B 的朋友”也说明“B 是 A 的朋友”，可以考虑反向关系；单向关系，例如“A 创作 B”，仅保留一个方向。
      5. 检查一致性与合理性，不能同时声称 A 是 B 的父亲和兄弟等矛盾关系；描述应符合强度。
      6. 将所有有效关系整理为 JSON 数组。

      ## 语言
      - 关系描述使用 {{language}}。

      ## 示例
      [输入]
      实体：[
        {"title":"罗密欧与朱丽叶","type":"Work","description":"莎士比亚创作的悲剧，讲述敌对家族两名青年之间的爱情"},
        {"title":"威廉·莎士比亚","type":"Person","description":"《罗密欧与朱丽叶》的作者，在职业生涯早期创作该剧"},
        {"title":"罗密欧·蒙太古","type":"Person","description":"该剧两位主角之一，来自蒙太古家族"},
        {"title":"朱丽叶·凯普莱特","type":"Person","description":"该剧两位主角之一，来自凯普莱特家族"},
        {"title":"维罗纳","type":"Location","description":"《罗密欧与朱丽叶》故事发生的意大利城市"},
        {"title":"蒙太古","type":"Organization","description":"剧中两个敌对家族之一，罗密欧所属的家族"},
        {"title":"凯普莱特","type":"Organization","description":"剧中两个敌对家族之一，朱丽叶所属的家族"}
      ]

      文本：《罗密欧与朱丽叶》是威廉·莎士比亚在职业生涯早期创作的悲剧，讲述两个敌对家族的意大利青年之间的爱情。这是他在世时最受欢迎的戏剧之一，也是最常上演的作品之一。故事发生在意大利的维罗纳。两位主角罗密欧·蒙太古和朱丽叶·凯普莱特尽管家族敌对，仍深深相爱。

      [输出]
      [
        {"source":"威廉·莎士比亚","target":"罗密欧与朱丽叶","description":"莎士比亚是《罗密欧与朱丽叶》的作者","strength":10},
        {"source":"罗密欧·蒙太古","target":"朱丽叶·凯普莱特","description":"罗密欧和朱丽叶尽管家族敌对，仍深深相爱","strength":8},
        {"source":"罗密欧·蒙太古","target":"蒙太古","description":"罗密欧属于蒙太古家族","strength":8},
        {"source":"朱丽叶·凯普莱特","target":"凯普莱特","description":"朱丽叶属于凯普莱特家族","strength":8},
        {"source":"罗密欧与朱丽叶","target":"罗密欧·蒙太古","description":"罗密欧是该剧的主角之一","strength":7},
        {"source":"罗密欧与朱丽叶","target":"朱丽叶·凯普莱特","description":"朱丽叶是该剧的主角之一","strength":7},
        {"source":"罗密欧与朱丽叶","target":"维罗纳","description":"故事发生在意大利维罗纳","strength":6},
        {"source":"蒙太古","target":"凯普莱特","description":"两家有长期激烈的冲突","strength":8}
      ]
