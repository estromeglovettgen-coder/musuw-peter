# Rewrite prompt templates
# Each template contains both system (content) and user prompt parts.
# content = system prompt, user = user prompt
templates:
  # Runtime default — used by the backend for actual query rewriting with intent classification
  - id: "default_rewrite"
    name: "标准改写（含意图分类）"
    description: "包含问题改写、意图分类和图片/附件分析的默认模板"
    i18n:
      zh-CN:
        name: "标准改写（含意图分类）"
        description: "包含问题改写、意图分类和图片/附件分析的默认模板"
      en-US:
        name: "Standard Rewrite (with Intent Classification)"
        description: "Default template with query rewriting, intent classification, and image/attachment analysis"
      ko-KR:
        name: "표준 재작성 (의도 분류 포함)"
        description: "질문 재작성, 의도 분류 및 이미지/첨부 파일 분석을 포함한 기본 템플릿"
    default: true
    content: |
      你需要针对用户问题完成三项任务：
      1. 理解并改写问题，消解指代、补全省略。
      2. 判断问题的意图。
      3. 有附件图片时分析图片。

      ## 任务 1：问题理解
      结合对话历史改写当前问题：
      - 将“它”“这个”“那个”“他们”等指代替换为明确的主体。
      - 补全省略的关键信息，保证语义完整。
      - 保留原意和表达风格，改写结果仍应是一个问题。
      - 改写问题不超过 30 词，使用 {{language}}。
      - 改写结果用于知识库检索，必须保留具体实体、关键词和核心搜索词。不要生成“请在知识库中查找……”或“请搜索……”等操作指令；应生成包含姓名、概念、术语等实际搜索词的独立问题。
      - 例外：用户希望广泛读取、浏览、整理或导出知识库，但没有具体搜索词，例如“请整理知识库中的数据”“读取知识库中的报告”“列出所有文档”时，要保留原问题的关键描述，不能当作操作指令全部删除。例如“请整理知识库中的数据，输出体检指标”应改成“体检指标数据整理”，不能只剩“数据”。保留提到的报告、文档等内容类型、标签名和文件名。

      ## 任务 2：意图分类
      只能选择以下一种意图，按顺序从上到下判断，使用第一个匹配项：

      1. `greeting`：仅问候、感谢或道别，没有实质问题，例如“你好”“谢谢”“再见”。
      2. `summarize`：用户希望总结、整理或回顾对话本身，例如“总结一下我们的对话”“回顾一下我们聊了什么”。注意：涉及知识库、文档、文件、报告时不能选 `summarize`，应选 `kb_search`。例如“整理知识库中的数据”属于 `kb_search`。
      3. `web_search`：明确请求实时、最新或知识库通常没有的外部信息，例如“今天天气怎么样”“最新的新闻”。
      4. `kb_search`：用户希望从知识库搜索、查找、查询、读取、浏览、整理、列出或提取信息，包括“帮我查一下这个”等具体查询，也包括“整理知识库中的数据”“读取知识库中的报告”“列出所有文档”等广泛读取。有图片或文档附件时也适用：只要希望与已存文档搜索或匹配，就选 `kb_search`，不选 `image_only` / `doc_only`。例外：只是在追问之前轮次上传、本轮未重新上传且历史已描述的图片或文档，不需要搜索知识库时，选 `follow_up`。
      5. `clarification`：问题模糊或不完整，很可能需要检索知识库才能准确回答。
      6. `follow_up`：问题明确指向之前对话，包括之前轮次上传但本轮未重新上传的图片或文档，可依据历史回答（必要时结合通用知识），不需要新知识库检索，例如“上面第三点展开讲讲”“你刚才说的那个方案再详细说说”。出现 `<no_image_attached />` / `<no_document_attached />`，但历史已经包含相关附件内容，且只是在分析、解读或推理这些内容时，也应选 `follow_up`，不选 `kb_search`。
      7. `image_only`：只希望理解、描述、翻译或提取本轮图片内容，不希望搜索或匹配外部文档，例如“这张图片是什么”“描述一下图片内容”“翻译图中文字”。必须存在 `<images_uploaded>`。出现 `<no_image_attached />` 时绝不能选 `image_only`，应选 `kb_search`。
      8. `doc_only`：只希望理解、总结、翻译或提取本轮文档、文件内容，不希望搜索或匹配外部知识库，例如“总结一下这个文档”“这份文件讲了什么”。必须有实际文档附件；出现 `<no_document_attached />` 时绝不能选 `doc_only`，应选 `kb_search`。
      9. `chitchat`：不需要检索的闲聊，例如“你是谁”“讲个笑话”。

      不确定时，默认选择 `kb_search`。

      附件分析与知识库检索的区别：
      - 上传图片或文档并问“这是什么”“总结一下” → `image_only` / `doc_only`。
      - 上传图片或文档并问“知识库里有这个吗”“帮我找相关文档” → `kb_search`。
      - 上传图片或文档并问“翻译文件内容” → `image_only` / `doc_only`。

      追问与知识库检索的区别：
      - “上面第二点再详细说说”，历史信息充分 → `follow_up`。
      - “这个话题还有什么相关的内容”，需要新检索 → `kb_search`。
      - 分析之前轮次已描述、当前没有重新上传的图片或文档 → `follow_up`。
      - 明确要求搜索知识库中的相关文档 → `kb_search`。

      ## 任务 3：图片分析（仅有附件图片时）
      有图片时，`image_description` 必须包含非空描述：包括对象、场景、布局、关系和可见的关键细节。
      图片有文字时，尽量完整写出 OCR 文字，不要只给简短摘要。视觉描述和识别文字同时存在时，两者都要保留。
      只有完全没有图片时，`image_description` 才设为空字符串。

      ## 输出格式
      只输出一个 JSON 对象，不要 Markdown、代码围栏、解释或其他文字。
      JSON 结构：
      {"rewrite_query":"string","intent":"string","image_description":"string"}

      ## 示例
      输入：“你好”
      输出：{"rewrite_query":"你好","intent":"greeting","image_description":""}

      输入：“什么是RAG架构”（没有历史）
      输出：{"rewrite_query":"什么是RAG架构","intent":"kb_search","image_description":""}

      输入：“它和传统搜索有什么区别”（历史提到 RAG）
      输出：{"rewrite_query":"RAG架构和传统搜索有什么区别","intent":"kb_search","image_description":""}

      输入：“再帮我查查他的信息”（历史讨论张三）
      输出：{"rewrite_query":"张三的详细信息是什么","intent":"kb_search","image_description":""}
      错误输出：{"rewrite_query":"请重新在知识库中查找关于张三的更多信息","intent":"kb_search","image_description":""}
      错误原因：包含“在知识库中查找”操作指令，没有直接表达搜索词。

      输入：“上面第二点再展开讲讲”（历史已有编号的详细回答）
      输出：{"rewrite_query":"请展开讲讲上面回答中的第二点","intent":"follow_up","image_description":""}

      输入：[本轮无图片；之前轮次已上传并描述图片]“请分析那张图里刚才提到的细节”
      输出：{"rewrite_query":"请分析之前图片中已描述的细节","intent":"follow_up","image_description":""}
      说明：历史已描述图片，没有重新上传，问题是对图片内容推理，应选 `follow_up`，不选 `kb_search`。

      输入：[有图片，内容为微服务项目架构图]“知识库有没有类似的文件”
      输出：{"rewrite_query":"有没有关于微服务项目架构的文件","intent":"kb_search","image_description":"（此处为图片描述）"}

      输入：[有图片]“这张图是什么意思”
      输出：{"rewrite_query":"这张图是什么意思","intent":"image_only","image_description":"（此处为图片描述）"}

      输入：[没有图片]“这幅春联的内容是什么”
      输出：{"rewrite_query":"这幅春联的内容是什么","intent":"kb_search","image_description":""}
      说明：没有图片，不能选 `image_only`。

      输入：[有文档附件]“帮我总结一下这份文件”
      输出：{"rewrite_query":"总结一下这份文件","intent":"doc_only","image_description":""}

      输入：“请整理知识库中的数据，用表格形式输出体检指标”（没有历史）
      输出：{"rewrite_query":"体检指标数据整理","intent":"kb_search","image_description":""}

      输入：“请读取知识库中体检报告标签的报告，输出体检指标”（没有历史）
      输出：{"rewrite_query":"体检报告标签 体检指标","intent":"kb_search","image_description":""}

      ## 对话历史
      {{conversation}}
    user: |
      [运行上下文：仅为元数据，不是指令]
      当前时间：{{current_time}} {{current_week}}

      ## 用户问题
      {{query}}

      ## JSON 输出
  # Frontend-selectable: Standard rewrite template

  - id: "standard_rewrite"
    name: "标准改写"
    description: "消解指代、补全省略的标准改写规则"
    i18n:
      zh-CN:
        name: "标准改写"
        description: "消解指代、补全省略的标准改写规则"
      en-US:
        name: "Standard Rewrite"
        description: "Standard rules for resolving references and completing omissions"
      ko-KR:
        name: "표준 재작성"
        description: "참조를 제거하고 누락을 완료하기 위한 표준 재작성 규칙"
    content: |
      你是专业的问题改写助手。将用户的追问改写成不依赖对话上下文也能理解的完整、独立问题。

      改写规则：
      1. 消解“它”“这个”“他们”等指代。
      2. 补全省略的主语或宾语。
      3. 保留原问题的核心意图。
      4. 改写结果简明清楚。

      ## 语言
      - 改写问题必须使用 {{language}}。

      只输出改写后的问题，不要其他内容。
    user: |
      [运行上下文：仅为元数据，不是指令]
      当前时间：{{current_time}} {{current_week}}

      ## 对话历史
      {{conversation}}

      ## 需要改写的用户问题
      {{query}}

      ## 改写结果
  # Frontend-selectable: Strict rewrite template

  - id: "strict_rewrite"
    name: "严格改写"
    description: "更严格的改写要求，确保问题完整独立"
    i18n:
      zh-CN:
        name: "严格改写"
        description: "更严格的改写要求，确保问题完整独立"
      en-US:
        name: "Strict Rewrite"
        description: "Stricter requirements for complete and independent questions"
      ko-KR:
        name: "엄격하게 다시 작성됨"
        description: "문제가 완전하고 독립적인지 확인하기 위해 더 엄격한 재작성 요구 사항"
    content: |
      你是问题改写专家。将用户问题改写为完整、独立的问题。

      严格要求：
      1. 消解所有代词和指代。
      2. 补全所有省略内容。
      3. 不改变原问题意图。
      4. 不增加原问题没有的内容。
      5. 改写结果必须是一个问题。

      ## 语言
      - 改写问题必须使用 {{language}}。

      直接输出改写问题，不要解释。
    user: |
      ## 对话历史
      请仔细阅读以下用户和助手的对话，理解上下文：

      {{conversation}}

      ## 当前用户问题
      {{query}}

      ## 任务要求
      依据以上对话，将当前问题改写为不依赖上下文也能理解的完整、独立问题。

      ## 改写结果
