# Fallback templates
# Contains both fixed-response templates and model-fallback prompt templates.
# Fixed responses: used directly as the reply when fallback_strategy = "fixed"
# Model prompts: used as the prompt to the LLM when fallback_strategy = "model"
templates:
  # --- Fixed response templates ---
  - id: "default_fallback"
    name: "标准兜底"
    description: "友好告知无法回答并提供建议"
    i18n:
      zh-CN:
        name: "标准兜底"
        description: "友好告知无法回答并提供建议"
      en-US:
        name: "Standard Fallback"
        description: "Friendly message with suggestions when unable to answer"
      ko-KR:
        name: "표준 폴백"
        description: "친절하게 답변 및 제안을 드릴 수 없음을 알려드립니다."
    default: true
    content: |
      抱歉，我没有在知识库中找到与这个问题直接相关的内容。

      你可以尝试：
      1. 换一种方式描述问题。
      2. 补充更具体的信息。
      3. 咨询相关领域的专业人士。

      如果还有其他问题，我很愿意继续帮助你。

      ## 语言
      - 始终使用 {{language}} 回答。

  - id: "polite_fallback"
    name: "礼貌兜底"
    description: "更加礼貌详细的无法回答提示"
    i18n:
      zh-CN:
        name: "礼貌兜底"
        description: "更加礼貌详细的无法回答提示"
      en-US:
        name: "Polite Fallback"
        description: "More polite and detailed unable-to-answer message"
      ko-KR:
        name: "정중한 폴백"
        description: "더 정중하고 자세한 답변 불가 프롬프트"
    content: |
      抱歉，我目前无法准确回答这个问题，可能是因为：
      - 问题超出了我的知识范围。
      - 知识库尚未包含相关内容。

      建议：
      1. 使用不同关键词重新描述。
      2. 将问题拆成更具体的子问题。
      3. 联系客服寻求帮助。

      感谢理解，我会继续帮助你处理其他问题。

      ## 语言
      - 始终使用 {{language}} 回答。

  - id: "brief_fallback"
    name: "简洁兜底"
    description: "简短的无法回答提示"
    i18n:
      zh-CN:
        name: "简洁兜底"
        description: "简短的无法回答提示"
      en-US:
        name: "Brief Fallback"
        description: "Short unable-to-answer message"
      ko-KR:
        name: "간단한 폴백"
        description: "대답할 수 없는 짧은 프롬프트"
    content: |
      抱歉，我暂时无法回答这个问题。请换一种方式描述，或联系客户支持。
  # --- Model fallback prompt templates (for fallback_strategy = "model") ---

  - id: "model_fallback"
    name: "模型兜底提示"
    description: "引导模型基于通用知识回答的提示词"
    i18n:
      zh-CN:
        name: "模型兜底提示"
        description: "引导模型基于通用知识回答的提示词"
      en-US:
        name: "Model Fallback Prompt"
        description: "Prompt to guide model to answer with general knowledge"
      ko-KR:
        name: "모델 폴백 프롬프트"
        description: "일반 지식을 바탕으로 모델이 답변하도록 안내하는 프롬프트"
    mode: "model"
    content: |
      检索没有找到直接匹配用户问题的内容，但知识库包含以下文档：

      {{kb_documents}}

      注意：
      1. 文档列表可用时，利用它帮助回答，例如列出相关文档，或建议哪些文档可能包含所需信息。
      2. 文档列表为空时，可以使用通用知识，但必须明确告知回答并非来自知识库。
      3. 涉及专业领域或需要最新信息时，建议用户查阅官方资料。
      4. 回答保持准确、客观。

      ## 语言
      - 始终使用 {{language}} 回答。

      用户问题：{{query}}

  - id: "default_fallback_prompt"
    name: "标准兜底 提示词"
    description: "知识库无相关结果时引导模型回答的默认提示词"
    i18n:
      zh-CN:
        name: "标准兜底 Prompt"
        description: "知识库无相关结果时引导模型回答的默认提示词"
      en-US:
        name: "Standard Fallback Prompt"
        description: "Default prompt that delegates to the model when KB has no relevant results"
      ko-KR:
        name: "표준 폴백 프롬프트"
        description: "KB에 관련 결과가 없을 때 모델에 위임하는 기본 프롬프트"
    mode: "model"
    content: |
      你是 Peter，一名专业、友善的 AI 助手。

      检索没有找到直接匹配用户问题的内容，但知识库包含以下文档：

      {{kb_documents}}

      ## 回答要求
      - 文档列表可用时，利用它帮助回答，例如列出相关文档、建议可能包含所需信息的文档，或概括知识库中已有的内容。
      - 文档列表为空或不相关时，可以使用通用知识，但必须明确告知回答并非来自知识库。
      - 回答简洁、清楚且有实质内容。
      - 涉及实时数据或个人隐私信息时，如无法获取，应如实说明。
      - 使用礼貌、专业的语气。
      - 始终使用 {{language}} 回答。

      ## 用户问题
      {{query}}
