      - tenant.credentials.openrouter.key_hash
    authority: OpenRouter child-key API plus encrypted Musuw tenant record
    source: WeKnora tenant credential persistence and entitlement service
    consumers: provider-backed model calls; tenant deletion and plan entitlement lifecycle
    owner: Musuw operator on behalf of each tenant
    permission: encrypted at rest; never serialized to browser or operator projection
    rotation: provider child-key lifecycle through the entitlement service
    revocation: provider child-key deletion followed by encrypted tenant field removal
    health: model request and provider usage metadata without returning key material

