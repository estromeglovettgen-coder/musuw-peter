# Metadata-only registry. Never add credential values, account identifiers,
# email addresses, hostnames, IP addresses, hashes, or provider response data.
schema_version: 1
registry_status: metadata-only
last_reviewed: "2026-08-30"

scope:
  active_repository: musuw-weknora
  repository_root: Documents/Codex
  authority_rule: current Musuw repository and provider dashboards are authoritative; sibling repositories are an inventory index only
  exclusions:
    - shell history
    - Codex sessions and rollouts
    - browser storage
    - git objects and blobs
  value_policy: variable names, service/account labels, file names, modes, booleans, and provider resource classes only

# `environment` is deliberately explicit. Production uses the separately
# reviewed Live unit while development/test retains Sandbox. Credentials,
# price catalogs, destinations, and checkout links are never interchangeable.
entries:
  - id: neo4j.staging.native-auth
    provider: neo4j
    environment: staging
    credential_class: server-secret
    status: configured
    variables:
      - NEO4J_AUTH
      - NEO4J_PASSWORD
    authority: isolated native staging Neo4j service
    source: protected staging runtime file neo4j_auth; generated independently on the server
    consumers: staging app entrypoint and reused native Neo4j entrypoint
    owner: Musuw operator
    permission: root-owned regular file mode 0600; internal staging network only
    rotation: update database authentication and the protected file together during a staging maintenance window
    revocation: replace the old database password after authenticated staging verification
    health: authenticated native graph query and staging container health; metadata-only evidence
    notes: Never reuse production authentication or place this value in public env, browser configuration, or release artifacts.

  - id: paddle.sandbox.public-client
    provider: paddle
    environment: sandbox
    credential_class: public-client
    status: active
    variables:
      - MUSUW_PADDLE_ENVIRONMENT
      - MUSUW_PADDLE_CLIENT_TOKEN
    authority: Paddle Sandbox account
    source: .runtime/weknora/paddle-sandbox.env and development/test runtime contract
    consumers: development/test Paddle.js initializer; billing Checkout and Plans views
    owner: Musuw operator
    permission: browser-visible public configuration; no server secret
    rotation: replace through the Paddle Sandbox dashboard and update the public env source
    revocation: revoke the previous Sandbox client token after a verified replacement
    health: Sandbox checkout configuration and authenticated billing config probe
    destination: Sandbox checkout and Sandbox notification destination
    domains: app-public-origin; storefront-public-origin is the product and pricing review surface
    default_link: app public Paddle.js payment-link page; provider binding is verified separately in Dashboard
    notes: Keep the SDK environment selector, client token, price catalog, and notification destination in Sandbox together.

  - id: paddle.sandbox.price-catalog
    provider: paddle
    environment: sandbox
    credential_class: public-catalog
    status: active
    variables:
      - MUSUW_PADDLE_PLUS_MONTHLY_PRICE_ID
      - MUSUW_PADDLE_PLUS_YEARLY_PRICE_ID
      - MUSUW_PADDLE_PRO_MONTHLY_PRICE_ID
      - MUSUW_PADDLE_PRO_YEARLY_PRICE_ID
      - MUSUW_PADDLE_MAX_MONTHLY_PRICE_ID
      - MUSUW_PADDLE_MAX_YEARLY_PRICE_ID
    authority: Paddle Sandbox catalog
    source: .runtime/weknora/paddle-sandbox.env and development/test runtime contract
    consumers: development/test entitlement price allowlist and checkout line items
    owner: Musuw operator
    permission: browser-visible identifiers; not payment credentials
    rotation: replace the full six-item catalog atomically when the Sandbox catalog changes
    revocation: archive retired Sandbox prices and remove them from the allowlist
    health: six distinct identifiers pass the generic environment contract and Sandbox price preview
    destination: Sandbox checkout
    domains: app-public-origin
    default_link: selected plan and billing period use the authenticated app checkout route

  - id: paddle.sandbox.api-key
    provider: paddle
    environment: sandbox
    credential_class: server-secret
    status: available
    variables:
      - MUSUW_PADDLE_API_KEY
    authority: Paddle Sandbox account
    source: Keychain service com.musuw.local-admin.paddle-api-key account musuw-admin-test; protected runtime file paddle_api_key
    consumers: development/test backend Paddle portal and subscription upgrade calls; TEST operations provider read
    owner: Musuw operator
    permission: Keychain metadata plus remote file mode 0600 and container read-only mount
    rotation: create a replacement in Paddle Sandbox, validate the official read path, then atomically replace the protected file
    revocation: revoke the previous Sandbox API key after the replacement health proof
    health: official Sandbox API read with counts and identifiers only
    destination: Paddle Sandbox API
    domains: app-public-origin
    default_link: authenticated billing portal session

  - id: paddle.sandbox.webhook-secret
    provider: paddle
    environment: sandbox
    credential_class: webhook-signing
    status: available
    variables:
      - MUSUW_PADDLE_WEBHOOK_SECRET
    authority: Paddle Sandbox notification destination
    source: Keychain service com.musuw.local-admin.paddle-webhook-secret account musuw-admin-test; protected runtime file paddle_webhook_secret
    consumers: /api/v1/billing/paddle/webhook; webhook signature verifier
    owner: Musuw operator
    permission: server-only Keychain/runtime file; never browser-visible
    rotation: create a new Sandbox notification destination secret and replace the protected file
    revocation: disable the previous Sandbox destination after delivery and signature health proof
    health: signed Sandbox notification fixture and delivery metadata without event payloads
    destination: Paddle Sandbox notification destination
    domains: app-public-origin
    default_link: none; webhook delivery is server-to-server

  - id: paddle.live.public-client
    provider: paddle
    environment: live
    credential_class: public-client
    status: active
    variables:
      - MUSUW_PADDLE_ENVIRONMENT
      - MUSUW_PADDLE_CLIENT_TOKEN
    authority: Paddle Live account
    source: GitHub production public input and protected Tokyo public runtime
    consumers: weknora/frontend Paddle.js initializer; billing Checkout and Plans views
    owner: Musuw operator
    permission: browser-visible public configuration; no server secret
    rotation: select an existing active Live client or create one only when replacement is required, verify checkout, then revoke the prior client
    revocation: revoke only after the replacement public unit and checkout health are verified
    health: Live public config, server price preview, and checkout opened to the payment form without a payment method
    destination: Paddle Live checkout
    domains: approved app public origin
    default_link: app public Paddle.js payment-link page
    notes: Keep SDK mode, public client, catalog, API key, and destination secret in the same Live unit.

  - id: paddle.live.price-catalog
    provider: paddle
    environment: live
    credential_class: public-catalog
    status: active
    variables:
      - MUSUW_PADDLE_PLUS_MONTHLY_PRICE_ID
      - MUSUW_PADDLE_PLUS_YEARLY_PRICE_ID
      - MUSUW_PADDLE_PRO_MONTHLY_PRICE_ID
      - MUSUW_PADDLE_PRO_YEARLY_PRICE_ID
      - MUSUW_PADDLE_MAX_MONTHLY_PRICE_ID
      - MUSUW_PADDLE_MAX_YEARLY_PRICE_ID
    authority: Paddle Live catalog
    source: GitHub production public input and protected Tokyo public runtime
    consumers: backend entitlement price allowlist; frontend checkout line items
    owner: Musuw operator
    permission: browser-visible identifiers; not payment credentials; never mix with Sandbox catalog
    rotation: replace the full six-item Live mapping atomically after provider meaning and checkout are verified
    revocation: archive retired prices only after their complete replacement mapping is live
    health: six active recurring SaaS prices resolve through the Live API and price preview
    destination: Paddle Live checkout
    domains: approved app public origin
    default_link: selected plan and billing period use the authenticated app checkout route

  - id: paddle.live.api-key
    provider: paddle
    environment: live
    credential_class: server-secret
    status: available
    variables:
      - MUSUW_PADDLE_API_KEY
    authority: Paddle Live account
    source: Keychain service com.musuw.local-admin.paddle-api-key account musuw-admin-production; protected runtime file paddle_api_key
    consumers: integration/weknora-production/app-entrypoint.sh; backend catalog, portal and subscription calls; production operations provider read
    owner: Musuw operator
    permission: server-only Keychain/runtime file and container read-only mount; required runtime scopes verified separately; current candidate is broader than minimal
    rotation: after auditing existing consumers, create a least-privilege Live replacement only when safe, prove required official reads and writes without a financial action, then atomically replace the file
    revocation: revoke the previous Live key only after replacement runtime and provider health
    health: official Live catalog/subscription capability reads plus root-owned file shape and application health
    destination: Paddle Live API
    domains: approved app public origin
    default_link: authenticated billing portal session
    notes: Credential presence alone is not health; the actual consumer and required permissions must succeed.

  - id: paddle.live.webhook-secret
    provider: paddle
    environment: live
    credential_class: webhook-signing
    status: available
    variables:
      - MUSUW_PADDLE_WEBHOOK_SECRET
    authority: exact Paddle Live notification destination
    source: destination-specific provider secret and protected runtime file paddle_webhook_secret
    consumers: production Paddle webhook raw-body signature verifier
    owner: Musuw operator
    permission: server-only root-owned runtime file and container read-only mount; never browser-visible
    rotation: rotate the existing destination secret and atomically replace the protected file before delivery verification
    revocation: disable a superseded destination only after signature, retry and idempotency health for the replacement
    health: official no-charge notification delivery, signed acceptance, bounded queue handoff, retry and duplicate evidence
    destination: one active production billing notification destination
    domains: app public webhook origin
    default_link: none; webhook delivery is server-to-server

  - id: musuw.legacy-template-and-fallbacks
    provider: multiple
    environment: development-only
    credential_class: server-secret
    status: deprecated
    variables:
      - MUSNOW_SUPABASE_URL
      - MUSNOW_SUPABASE_PUBLISHABLE_KEY
      - DEEPSEEK_API_KEY
      - MUSNOW_DEEPSEEK_SECRET_STATE
      - MUSNOW_WEB_SEARCH_API_KEY
      - MUSNOW_WEB_SEARCH_ENGINE_ID
      - MUSNOW_VLM_API_KEY
      - MUSNOW_PADDLE_ENVIRONMENT
      - MUSNOW_PADDLE_API_KEY
      - MUSNOW_PADDLE_CLIENT_TOKEN
      - MUSNOW_PADDLE_WEBHOOK_SECRET
      - MUSNOW_PADDLE_PLUS_MONTHLY_PRICE_ID
      - MUSNOW_PADDLE_PLUS_YEARLY_PRICE_ID
      - MUSNOW_PADDLE_PRO_MONTHLY_PRICE_ID
      - MUSNOW_PADDLE_PRO_YEARLY_PRICE_ID
      - MUSNOW_PADDLE_MAX_MONTHLY_PRICE_ID
      - MUSNOW_PADDLE_MAX_YEARLY_PRICE_ID
    authority: current Musuw named MUSUW_* contract and owning provider dashboards
    source: tracked top-level .env.example and legacy fallback names in WeKnora entitlement loading
    consumers: no supported production consumer; fallback names are retained only for compatibility tests and migration review
    owner: Musuw repository maintainers
    permission: do not populate in production; server-only if a compatibility test explicitly injects a value
    rotation: migrate any remaining caller to the named MUSUW_* or provider-specific contract, then remove the alias
    revocation: remove legacy values from ignored environments and revoke any provider credential that was only reachable through an alias
    health: deprecated; the registry and production preflight must use the named current contract instead
    notes: Empty/example assignments are not evidence of a configured credential. This entry prevents stale aliases from being mistaken for a second authority.

  - id: openrouter.management
    provider: openrouter
    environment: production
    credential_class: management-admin
    status: configured
    variables:
      - OPENROUTER_MANAGEMENT_API_KEY
    authority: OpenRouter management API
    source: protected runtime file openrouter_management_api_key
    consumers: integration/weknora-production/app-entrypoint.sh; entitlement service child-key provisioning and usage/limit reads
    owner: Musuw operator
    permission: server-only file mode 0600 and container read-only mount
    rotation: create a replacement through OpenRouter management controls and validate child-key/usage reads
    revocation: revoke old management key after replacement health proof
    health: management API capability probe with counts and limit metadata only

  - id: openrouter.tenant-child
