<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>火种 · 展示面功能说明</title><link rel="stylesheet" href="./legal.css"></head><body><main><h1>展示面功能说明</h1><p>展示面是火种的附加创作工具，提供参考图片合成、自由创作、素材管理、作品预览与原图下载。</p><h2>参考合成</h2><p>上传图片后，分别选择脸部、穿搭、动作、背景等参考内容，再提交生成。你可以调整不同素材提供的内容，原图不会被平台主动压缩后再送入生成接口。</p><h2>图片额度</h2><p>套餐图片额度由管理员配置。生成过程中会预占额度，成功交付后计入已用张数；明确失败时释放，结果待确认时保留任务供核实。图片额度与对话额度分别管理。</p><h2>图片使用</h2><p>请仅上传有权使用的图片。生成的作品是 AI 创作结果，不是对真实拍摄过程或事件的证明。有关素材与服务商处理的说明，请查看<a href="./privacy.html">图片处理说明</a>。</p><footer><a href="./">返回展示面</a></footer></main></body></html>
