# This fragment lives inside the native frontend Nginx server block. It is a
# static login/consent presentation layer only; auth protocol exchanges happen
# same-origin through the native /api/v1/auth/oidc routes.
location = /auth {
    include /etc/nginx/musuw-noindex.conf;
    return 302 /auth/start;
}

location = /auth/start {
    include /etc/nginx/musuw-noindex.conf;
    root /usr/share/nginx/html;
    try_files /auth/index.html =404;
    add_header Cache-Control "no-cache, must-revalidate" always;
}

location = /auth/callback {
    include /etc/nginx/musuw-noindex.conf;
    root /usr/share/nginx/html;
    try_files /auth/index.html =404;
    add_header Cache-Control "no-cache, must-revalidate" always;
}

location = /auth/logout {
    include /etc/nginx/musuw-noindex.conf;
    root /usr/share/nginx/html;
    try_files /auth/index.html =404;
    add_header Cache-Control "no-cache, must-revalidate" always;
}

location = /oauth/consent {
    include /etc/nginx/musuw-noindex.conf;
    root /usr/share/nginx/html;
    try_files /auth/index.html =404;
    add_header Cache-Control "no-cache, must-revalidate" always;
}

location ^~ /auth/assets/ {
    include /etc/nginx/musuw-noindex.conf;
    alias /usr/share/nginx/html/auth/assets/;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /auth/ {
    include /etc/nginx/musuw-noindex.conf;
    root /usr/share/nginx/html;
    try_files $uri $uri/ /auth/index.html;
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
}
