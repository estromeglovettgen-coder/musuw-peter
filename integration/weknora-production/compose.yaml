# Production-only overlay. Always render it together with the official source
# Compose file through scripts/weknora-production/compose.sh. The base file
# supplies the native WeKnora topology; this overlay makes its production
# identity explicit without introducing a gateway or legacy business service.
services:
  frontend:
    platform: linux/amd64
    image: ${WEKNORA_PRODUCTION_FRONTEND_IMAGE:?set WEKNORA_PRODUCTION_FRONTEND_IMAGE in production.env}
    build: !reset null
    container_name: weknora-v072-production-frontend
    ports: !override
      - "127.0.0.1:${WEKNORA_PRODUCTION_FRONTEND_PORT:-4191}:8080"
    expose:
      - "8080"
    environment: !override
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-50}
      MUSUW_DEPLOYMENT_ENVIRONMENT: production
      MUSUW_AUTH_PUBLIC_ORIGIN: ${MUSUW_AUTH_PUBLIC_ORIGIN:?generated by prepare-runtime.sh}
      MUSUW_SUPABASE_URL: ${MUSUW_SUPABASE_URL:?generated by prepare-runtime.sh}
      MUSUW_SUPABASE_PUBLISHABLE_KEY: ${MUSUW_SUPABASE_PUBLISHABLE_KEY:?generated by prepare-runtime.sh}
      MUSUW_WEKNORA_OAUTH_CLIENT_ID: ${MUSUW_WEKNORA_OAUTH_CLIENT_ID:?generated by prepare-runtime.sh}
      APP_HOST: weknora-v072-production-app
      APP_PORT: "8080"
      APP_SCHEME: http
    depends_on: !override
      app:
        condition: service_healthy
    networks: !override
      WeKnora-network: {}
    volumes:
      - ${WEKNORA_PRODUCTION_RUNTIME_DIR:?generated by prepare-runtime.sh}/paddle-ips:/etc/nginx/paddle-ips:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  app:
    platform: linux/amd64
    image: ${WEKNORA_PRODUCTION_APP_IMAGE:?set WEKNORA_PRODUCTION_APP_IMAGE in production.env}
    build: !reset null
    container_name: weknora-v072-production-app
    ports: !override
      - "127.0.0.1:${WEKNORA_PRODUCTION_APP_PORT:-18091}:8080"
    env_file: !override
      - ${WEKNORA_PRODUCTION_RUNTIME_DIR:?set WEKNORA_PRODUCTION_RUNTIME_DIR}/production.env
    environment: !override
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_PATH: /var/log/weknora/app.log
      GIN_MODE: ${GIN_MODE:-release}
      TZ: ${TZ:-Asia/Shanghai}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      AUTO_RECOVER_DIRTY: ${AUTO_RECOVER_DIRTY:-true}
      DB_DRIVER: ${DB_DRIVER:-postgres}
      RETRIEVE_DRIVER: ${RETRIEVE_DRIVER:-postgres}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:?set DB_USER in production.env}
      DB_NAME: ${DB_NAME:?set DB_NAME in production.env}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      STREAM_MANAGER_TYPE: ${STREAM_MANAGER_TYPE:-redis}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PREFIX: ${REDIS_PREFIX:-stream:}
      WEKNORA_REDIS_NAMESPACE: ${WEKNORA_REDIS_NAMESPACE:?set WEKNORA_REDIS_NAMESPACE in production.env}
      WEKNORA_HOUSEKEEPING_ENABLED: "true"
      DOCREADER_ADDR: ${DOCREADER_ADDR:-docreader:50051}
      DOCREADER_TRANSPORT: ${DOCREADER_TRANSPORT:-grpc}
      STORAGE_TYPE: s3
      S3_ENDPOINT: https://c692db4757e1454b71880ec6c431db9c.r2.cloudflarestorage.com
      S3_REGION: auto
      S3_BUCKET_NAME: musuw-production
      S3_PATH_PREFIX: weknora
      S3_USE_SSL: "true"
      S3_FORCE_PATH_STYLE: "true"
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-true}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://jp.cloud.langfuse.com}
      LANGFUSE_RELEASE: ${LANGFUSE_RELEASE:-musuw-production}
      LANGFUSE_ENVIRONMENT: ${LANGFUSE_ENVIRONMENT:-production}
      LOCAL_STORAGE_BASE_DIR: /data/files
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-50}
      # URL-backed video understanding can include a 300 MB remote fetch plus
      # model inference; keep it below the 2h document-task deadline.
      VLM_HTTP_TIMEOUT_SECONDS: "600"
      APP_EXTERNAL_URL: ${APP_EXTERNAL_URL:?set APP_EXTERNAL_URL in production.env}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:?set FRONTEND_BASE_URL in production.env}
      NEO4J_ENABLE: ${NEO4J_ENABLE:-true}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      DISABLE_REGISTRATION: ${DISABLE_REGISTRATION:-false}
      WEKNORA_AUTH_DEFAULT_TENANT_MODE: ${WEKNORA_AUTH_DEFAULT_TENANT_MODE:-create_personal}
      OIDC_AUTH_ENABLE: ${OIDC_AUTH_ENABLE:-true}
      OIDC_AUTH_ISSUER_URL: ${OIDC_AUTH_ISSUER_URL:?set OIDC_AUTH_ISSUER_URL in production.env}
      OIDC_AUTH_DISCOVERY_URL: ${OIDC_AUTH_DISCOVERY_URL:?set OIDC_AUTH_DISCOVERY_URL in production.env}
      OIDC_AUTH_AUTHORIZATION_ENDPOINT: ${OIDC_AUTH_ISSUER_URL:?set OIDC_AUTH_ISSUER_URL in production.env}/oauth/authorize
      OIDC_AUTH_TOKEN_ENDPOINT: ${OIDC_AUTH_ISSUER_URL:?set OIDC_AUTH_ISSUER_URL in production.env}/oauth/token
      OIDC_AUTH_USER_INFO_ENDPOINT: ${OIDC_AUTH_ISSUER_URL:?set OIDC_AUTH_ISSUER_URL in production.env}/oauth/userinfo
      OIDC_AUTH_PROVIDER_DISPLAY_NAME: ${OIDC_AUTH_PROVIDER_DISPLAY_NAME:-Musuw}
      OIDC_AUTH_SCOPES: ${OIDC_AUTH_SCOPES:-openid profile email}
      OIDC_USER_INFO_MAPPING_USER_NAME: ${OIDC_USER_INFO_MAPPING_USER_NAME:-name}
      OIDC_USER_INFO_MAPPING_EMAIL: ${OIDC_USER_INFO_MAPPING_EMAIL:-email}
      SSRF_WHITELIST_EXTRA: ${SSRF_WHITELIST_EXTRA:?generated by prepare-runtime.sh}
    entrypoint: ["/bin/sh", "/opt/weknora-production/app-entrypoint.sh"]
    command: ["./WeKnora"]
    volumes: !override
      - data-files:/data/files
      - app-logs:/var/log/weknora
      - docreader-tmp:/tmp/docreader:ro
      - ../weknora/config/config.yaml:/app/config/config.yaml:ro
      - ../integration/weknora-production/app-entrypoint.sh:/opt/weknora-production/app-entrypoint.sh:ro
      - ../integration/weknora-production/paddle-runtime-contract.sh:/opt/weknora-production/paddle-runtime-contract.sh:ro
    secrets:
      - source: db_password
        target: db_password
        mode: 0400
      - source: redis_password
        target: redis_password
        mode: 0400
      - source: system_aes_key
        target: system_aes_key
        mode: 0400
      - source: jwt_secret
        target: jwt_secret
        mode: 0400
      - source: neo4j_auth
        target: neo4j_auth
        mode: 0400
      - source: oidc_client_id
        target: oidc_client_id
        mode: 0400
      - source: oidc_client_secret
        target: oidc_client_secret
        mode: 0400
      - source: supabase_service_role_key
        target: supabase_service_role_key
        mode: 0400
      - source: openrouter_management_api_key
        target: openrouter_management_api_key
        mode: 0400
      - source: tikhub_api_key
        target: tikhub_api_key
        mode: 0400
      - source: paddle_api_key
        target: paddle_api_key
        mode: 0400
      - source: paddle_webhook_secret
        target: paddle_webhook_secret
        mode: 0400
      - source: r2_access_key_id
        target: r2_access_key_id
        mode: 0400
      - source: r2_secret_access_key
        target: r2_secret_access_key
        mode: 0400
      - source: langfuse_public_key
        target: langfuse_public_key
        mode: 0400
      - source: langfuse_secret_key
        target: langfuse_secret_key
        mode: 0400
    depends_on: !override
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      docreader:
        condition: service_healthy
      neo4j:
        condition: service_started
    networks: !override
      WeKnora-network: {}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  docreader:
    platform: linux/amd64
    image: wechatopenai/weknora-docreader@sha256:b9c4636b65b5d4947d5e09cd311ba6cf37f1f2da37c51d4be2b911d432f12abe
    build: !reset null
    container_name: weknora-v072-production-docreader
    environment: !override
      TZ: ${TZ:-Asia/Shanghai}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DOCREADER_IMAGE_OUTPUT_DIR: /tmp/docreader
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-50}
      DOCREADER_GRPC_PORT: "50051"
    volumes: !override
      - docreader-tmp:/tmp/docreader
    networks: !override
      WeKnora-network: {}
    restart: unless-stopped

  postgres:
    platform: linux/amd64
    image: paradedb/paradedb:v0.22.2-pg17
    container_name: weknora-v072-production-postgres
    environment: !override
      POSTGRES_USER: ${DB_USER:?set DB_USER in production.env}
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in production.env}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes: !override
      - postgres-data:/var/lib/postgresql/data
    secrets:
      - source: db_password
        target: db_password
        mode: 0400
    networks: !override
      WeKnora-network: {}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:?set DB_USER in production.env} -d ${DB_NAME:?set DB_NAME in production.env}"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 1m

  redis:
    platform: linux/amd64
    image: redis:7.0-alpine
    container_name: weknora-v072-production-redis
    entrypoint: ["/bin/sh", "/opt/weknora-production/redis-entrypoint.sh"]
    command: []
    volumes:
      - redis-data:/data
      - ../integration/weknora-production/redis-entrypoint.sh:/opt/weknora-production/redis-entrypoint.sh:ro
    secrets:
      - source: redis_password
        target: redis_password
        mode: 0400
    networks: !override
      WeKnora-network: {}
    restart: unless-stopped

  neo4j:
    platform: linux/amd64
    image: neo4j:2025.10.1
    container_name: weknora-v072-production-neo4j
    ports: !override []
    volumes: !override
      - neo4j-data:/data
      - ../integration/weknora-production/neo4j-entrypoint.sh:/opt/weknora-production/neo4j-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/opt/weknora-production/neo4j-entrypoint.sh"]
    command: ["neo4j"]
    environment: !override
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_apoc_import_file_use__neo4j__config: "true"
      NEO4JLABS_PLUGINS: '["apoc"]'
    secrets:
      - source: neo4j_auth
        target: neo4j_auth
        mode: 0400
    networks: !override
      WeKnora-network: {}
    restart: unless-stopped
    profiles:
      - neo4j

  searxng-init:
    platform: linux/amd64
    image: busybox:1.36
    container_name: weknora-v072-production-searxng-init
    command: ["sh", "-c", "cp /template/settings.yml /etc/searxng/settings.yml && chmod 0644 /etc/searxng/settings.yml"]
    volumes: !override
      - ../weknora/docker/searxng/settings.yml:/template/settings.yml:ro
      - searxng_config:/etc/searxng
    restart: "no"
    networks: !override
      WeKnora-network: {}
    profiles:
      - searxng

  searxng:
    platform: linux/amd64
    image: searxng/searxng:latest
    container_name: weknora-v072-production-searxng
    ports: !override
      - "127.0.0.1:${WEKNORA_PRODUCTION_SEARXNG_PORT:-8891}:8080"
    volumes: !override
      - searxng_config:/etc/searxng
      - ../integration/weknora-production/searxng-entrypoint.sh:/opt/weknora-production/searxng-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/opt/weknora-production/searxng-entrypoint.sh"]
    command: []
    environment: !override
      SEARXNG_BASE_URL: http://localhost:${WEKNORA_PRODUCTION_SEARXNG_PORT:-8891}/
      INSTANCE_NAME: weknora-v072-production-searxng
    secrets:
      - source: searxng_secret
        target: searxng_secret
        mode: 0400
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    restart: unless-stopped
    depends_on: !override
      searxng-init:
        condition: service_completed_successfully
    networks: !override
      WeKnora-network: {}
    profiles:
      - searxng

networks:
  WeKnora-network:
    name: weknora-v072-production-internal
    driver: bridge

volumes:
  app-logs:
    name: weknora-v072-production-app-logs
  postgres-data:
    external: true
    name: ${WEKNORA_PRODUCTION_POSTGRES_VOLUME:?set WEKNORA_PRODUCTION_POSTGRES_VOLUME in production.env}
  data-files:
    external: true
    name: ${WEKNORA_PRODUCTION_FILES_VOLUME:?set WEKNORA_PRODUCTION_FILES_VOLUME in production.env}
  docreader-tmp:
    external: true
    name: ${WEKNORA_PRODUCTION_DOCREADER_TMP_VOLUME:?set WEKNORA_PRODUCTION_DOCREADER_TMP_VOLUME in production.env}
  redis-data:
    external: true
    name: ${WEKNORA_PRODUCTION_REDIS_VOLUME:?set WEKNORA_PRODUCTION_REDIS_VOLUME in production.env}
  neo4j-data:
    external: true
    name: ${WEKNORA_PRODUCTION_NEO4J_VOLUME:?set WEKNORA_PRODUCTION_NEO4J_VOLUME in production.env}
  searxng_config:
    name: ${WEKNORA_PRODUCTION_SEARXNG_CONFIG_VOLUME:?set WEKNORA_PRODUCTION_SEARXNG_CONFIG_VOLUME in production.env}

secrets:
  db_password:
    file: ${WEKNORA_PRODUCTION_SECRET_DIR:?set WEKNORA_PRODUCTION_SECRET_DIR in production.env}/db_password
  redis_password:
    file: ${WEKNORA_PRODUCTION_SECRET_DIR:?set WEKNORA_PRODUCTION_SECRET_DIR in production.env}/redis_password
  system_aes_key:
    file: ${WEKNORA_PRODUCTION_SECRET_DIR:?set WEKNORA_PRODUCTION_SECRET_DIR in production.env}/system_aes_key
  jwt_secret:
    file: ${WEKNORA_PRODUCTION_SECRET_DIR:?set WEKNORA_PRODUCTION_SECRET_DIR in production.env}/jwt_secret
  neo4j_auth:
    file: ${WEKNORA_PRODUCTION_SECRET_DIR:?set WEKNORA_PRODUCTION_SECRET_DIR in production.env}/neo4j_auth
  oidc_client_id:
    file: ${WEKNORA_PRODUCTION_SECRET_DIR:?set WEKNORA_PRODUCTION_SECRET_DIR in production.env}/oidc_client_id
  oidc_client_secret:
    file: ${WEKNORA_PRODUCTION_SECRET_DIR:?set WEKNORA_PRODUCTION_SECRET_DIR in production.env}/oidc_client_secret
  supabase_service_role_key:
    file: ${WEKNORA_PRODUCTION_SECRET_DIR:?set WEKNORA_PRODUCTION_SECRET_DIR in production.env}/supabase_service_role_key
  searxng_secret:
    file: ${WEKNORA_PRODUCTION_SECRET_DIR:?set WEKNORA_PRODUCTION_SECRET_DIR in production.env}/searxng_secret
  openrouter_management_api_key:
    file: ${WEKNORA_PRODUCTION_SECRET_DIR:?set WEKNORA_PRODUCTION_SECRET_DIR in production.env}/openrouter_management_api_key
  tikhub_api_key:
    file: ${WEKNORA_PRODUCTION_SECRET_DIR:?set WEKNORA_PRODUCTION_SECRET_DIR in production.env}/tikhub_api_key
  paddle_api_key:
    file: ${WEKNORA_PRODUCTION_SECRET_DIR:?set WEKNORA_PRODUCTION_SECRET_DIR in production.env}/paddle_api_key
  paddle_webhook_secret:
    file: ${WEKNORA_PRODUCTION_SECRET_DIR:?set WEKNORA_PRODUCTION_SECRET_DIR in production.env}/paddle_webhook_secret
  r2_access_key_id:
    file: ${WEKNORA_PRODUCTION_SECRET_DIR:?set WEKNORA_PRODUCTION_SECRET_DIR in production.env}/r2_access_key_id
  r2_secret_access_key:
    file: ${WEKNORA_PRODUCTION_SECRET_DIR:?set WEKNORA_PRODUCTION_SECRET_DIR in production.env}/r2_secret_access_key
  langfuse_public_key:
    file: ${WEKNORA_PRODUCTION_SECRET_DIR:?set WEKNORA_PRODUCTION_SECRET_DIR in production.env}/langfuse_public_key
  langfuse_secret_key:
    file: ${WEKNORA_PRODUCTION_SECRET_DIR:?set WEKNORA_PRODUCTION_SECRET_DIR in production.env}/langfuse_secret_key
