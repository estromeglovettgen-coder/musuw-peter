# This fragment is included inside WeKnora's upstream `server` block.
# Auth is static presentation only; `/api`, `/files`, and `/r` keep the
# upstream WeKnora proxy behavior from nginx.conf.template.
location = /auth {
    return 302 /auth/start;
}

location = /auth/start {
    root /usr/share/nginx/html;
    try_files /auth/index.html =404;
    add_header Cache-Control "no-cache, must-revalidate" always;
}

location = /auth/callback {
    root /usr/share/nginx/html;
    try_files /auth/index.html =404;
    add_header Cache-Control "no-cache, must-revalidate" always;
}

location = /auth/logout {
    root /usr/share/nginx/html;
    try_files /auth/index.html =404;
    add_header Cache-Control "no-cache, must-revalidate" always;
}

location = /oauth/consent {
    root /usr/share/nginx/html;
    try_files /auth/index.html =404;
    add_header Cache-Control "no-cache, must-revalidate" always;
}

location ^~ /auth/assets/ {
    alias /usr/share/nginx/html/auth/assets/;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /auth/ {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /auth/index.html;
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
}
