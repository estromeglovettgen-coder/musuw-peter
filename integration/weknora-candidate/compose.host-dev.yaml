# Host-development overlay. It is deliberately used only by
# `scripts/musuw-dev deps up`: the application and both Vite servers stay on
# the host, while the official WeKnora dependency services keep their isolated
# candidate volumes in Docker.
services:
  postgres:
    ports: !override
      - "127.0.0.1:${MUSUW_DEV_DB_PORT:-15432}:5432"

  redis:
    ports: !override
      - "127.0.0.1:${MUSUW_DEV_REDIS_PORT:-16380}:6379"

  docreader:
    ports: !override
      - "127.0.0.1:${MUSUW_DEV_DOCREADER_PORT:-15051}:50051"

  neo4j:
    ports: !override
      - "127.0.0.1:${MUSUW_DEV_NEO4J_HTTP_PORT:-17474}:7474"
      - "127.0.0.1:${MUSUW_DEV_NEO4J_BOLT_PORT:-17687}:7687"

  searxng:
    ports: !override
      - "127.0.0.1:${MUSUW_DEV_SEARXNG_PORT:-8890}:8080"
